<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Qty</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 text-center">
        <h4>Product Name</h4>
        <p class="text-muted">Price per piece: <strong>20 টাকা</strong></p>

        <div class="d-flex justify-content-center align-items-center gap-3">

            <button class="btn btn-danger btn-lg" id="minusBtn">-</button>

            <h3 id="qty">0</h3>

            <button class="btn btn-success btn-lg" id="plusBtn">+</button>

        </div>

        <h4 class="mt-4">Total: <span id="total">0</span> টাকা</h4>
    </div>
</div>


<script>
    $(document).ready(function () {
        let price = 20; 

        $("#plusBtn").click(function () {
            let qty = parseInt($("#qty").text());
            qty++;
            $("#qty").text(qty);
            $("#total").text(qty * price);
        });
        $("#minusBtn").click(function () {
            let qty = parseInt($("#qty").text());
            if (qty <= 0) {
                Swal.fire({
                    icon: "warning",
                    title: "Quantity 0 এর নিচে নেয়া যাবে না!"
                });
                return;
            }
            qty--;
            $("#qty").text(qty);
            $("#total").text(qty * price);
        });
    });
</script>

</body>
</html>
